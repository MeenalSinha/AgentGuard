apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: agentguard-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/agentguard-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: REDIS_URL
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentguard-secrets
                  key: GOOGLE_API_KEY
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
